<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg,#fff);color:var(--text,#222)}
.toolbar,.coordinates{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}button,select,input{font:inherit;color:inherit;background:var(--bg,#fff);border:1px solid #8888;border-radius:5px;padding:5px 9px}button{cursor:pointer}button[aria-pressed=true]{border-color:#e64d4d;background:#e64d4d25}button:disabled,input:disabled{opacity:.5}canvas{display:block;max-width:100%;touch-action:none;border:1px solid #8888;border-radius:5px}.coordinates input{width:88px}.hint{color:var(--text,#555);opacity:.8;font-size:12px;margin:5px 0}.list{max-height:145px;overflow:auto;display:flex;flex-wrap:wrap;gap:5px}.list button{font-size:12px}.list button.selected{border-color:#e64d4d}#message{min-height:20px;color:#d04a33}
</style></head><body>
<div class="toolbar">
<button id="draw" aria-pressed="true">画框</button><button id="select" aria-pressed="false">选择/移动</button>
<label>框类别 <select id="class" aria-label="框类别"><option value="fire">火焰 fire</option><option value="smoke">烟雾 smoke</option></select></label>
<button id="remove">删除选中框</button><button id="undo">撤销</button><button id="clear">清空所有框</button>
<span id="count" aria-live="polite"></span>
</div>
<p class="hint">拖动画框；“选择/移动”可移动框或拖动四角缩放。点下方编号可选框，坐标为原图像素。修改后需在页面下方保存。</p>
<canvas id="canvas" tabindex="0" aria-label="标注画布"></canvas>
<div class="coordinates"><label>x1 <input id="x1" aria-label="x1" type="number" step="0.1"></label><label>y1 <input id="y1" aria-label="y1" type="number" step="0.1"></label><label>x2 <input id="x2" aria-label="x2" type="number" step="0.1"></label><label>y2 <input id="y2" aria-label="y2" type="number" step="0.1"></label></div>
<div id="message" aria-live="polite"></div><div id="list" class="list"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let doc=null,boxes=[],selected=-1,mode='draw',image=new Image(),width=1,height=1,scale=1,drag=null,undo=[];
const clone=value=>JSON.parse(JSON.stringify(value));
const send=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},'*');
const publish=()=>send('streamlit:setComponentValue',{value:{document_key:doc,boxes:clone(boxes)},dataType:'json'});
function remember(before){undo.push(before);if(undo.length>25)undo.shift();}
function uid(){return crypto.randomUUID().replaceAll('-','');}
function valid(b){const [x1,y1,x2,y2]=b.xyxy;return [x1,y1,x2,y2].every(Number.isFinite)&&x1>=0&&y1>=0&&x2<=width&&y2<=height&&x2-x1>=1&&y2-y1>=1;}
function fit(){
 const maxW=Math.min(document.documentElement.clientWidth-2,1100,width),maxH=620;
 scale=Math.min(maxW/width,maxH/height);canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));
 render();send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8});
}
function render(){
 ctx.clearRect(0,0,canvas.width,canvas.height);if(image.complete&&image.naturalWidth)ctx.drawImage(image,0,0,canvas.width,canvas.height);
 boxes.forEach((b,i)=>{const [x1,y1,x2,y2]=b.xyxy.map(v=>v*scale);ctx.strokeStyle=b.class==='fire'?'#ff564d':'#27b9ef';ctx.lineWidth=i===selected?3:2;ctx.strokeRect(x1,y1,x2-x1,y2-y1);ctx.fillStyle=ctx.strokeStyle;ctx.font='bold 13px sans-serif';ctx.fillText(`${i+1} ${b.class}`,x1+3,Math.max(14,y1-4));if(i===selected){for(const [x,y]of[[x1,y1],[x2,y1],[x1,y2],[x2,y2]])ctx.fillRect(x-4,y-4,8,8);}});
 $('count').textContent=`${boxes.length} 个框`;$('remove').disabled=selected<0;$('undo').disabled=!undo.length;
 for(const [i,key]of['x1','y1','x2','y2'].entries()){$(key).disabled=selected<0;$(key).value=selected<0?'':Math.round(boxes[selected].xyxy[i]*100)/100;}
 if(selected>=0)$('class').value=boxes[selected].class;
 const list=$('list');list.replaceChildren();boxes.forEach((b,i)=>{const button=document.createElement('button');button.textContent=`${i+1} · ${b.class} · ${b.xyxy.map(v=>Math.round(v)).join(', ')}`;button.className=i===selected?'selected':'';button.onclick=()=>{selected=i;setMode('select');render();};list.append(button);});
}
function setMode(value){mode=value;for(const key of['draw','select'])$(key).setAttribute('aria-pressed',String(key===value));}
function point(event){const rect=canvas.getBoundingClientRect();return[Math.max(0,Math.min(width,(event.clientX-rect.left)*width/rect.width)),Math.max(0,Math.min(height,(event.clientY-rect.top)*height/rect.height))];}
function hit(p){for(let i=boxes.length-1;i>=0;i--){const [a,b,c,d]=boxes[i].xyxy;if(p[0]>=a&&p[0]<=c&&p[1]>=b&&p[1]<=d)return i;}return-1;}
canvas.onpointerdown=event=>{
 if(!image.naturalWidth)return;canvas.focus();canvas.setPointerCapture(event.pointerId);const p=point(event),before=clone(boxes);$('message').textContent='';
 if(mode==='draw'){selected=boxes.length;boxes.push({id:uid(),class:$('class').value,xyxy:[...p,...p]});drag={type:'draw',start:p,before};}
 else{let corner=-1;if(selected>=0){const [a,b,c,d]=boxes[selected].xyxy;corner=[[a,b],[c,b],[a,d],[c,d]].findIndex(q=>Math.hypot((p[0]-q[0])*scale,(p[1]-q[1])*scale)<10);}
  if(corner>=0){const b=boxes[selected].xyxy;drag={type:'resize',anchor:[[b[2],b[3]],[b[0],b[3]],[b[2],b[1]],[b[0],b[1]]][corner],before};}
  else{selected=hit(p);if(selected>=0)drag={type:'move',start:p,original:clone(boxes[selected]),before};}}
 render();
};
canvas.onpointermove=event=>{if(!drag)return;const p=point(event),b=boxes[selected];if(drag.type==='draw'||drag.type==='resize'){const start=drag.type==='draw'?drag.start:drag.anchor;b.xyxy=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.max(start[0],p[0]),Math.max(start[1],p[1])];}
 else{const[a,c,d,e]=drag.original.xyxy,w=d-a,h=e-c,x=Math.max(0,Math.min(width-w,a+p[0]-drag.start[0])),y=Math.max(0,Math.min(height-h,c+p[1]-drag.start[1]));b.xyxy=[x,y,x+w,y+h];}render();};
canvas.onpointerup=()=>{if(!drag)return;const before=drag.before;drag=null;if(!boxes.every(valid)){boxes=before;selected=-1;$('message').textContent='框的宽高须至少1个原图像素。';}
 else if(JSON.stringify(before)!==JSON.stringify(boxes)){remember(before);publish();}render();};
canvas.onpointercancel=()=>{if(drag){boxes=drag.before;drag=null;selected=-1;render();}};
$('draw').onclick=()=>setMode('draw');$('select').onclick=()=>setMode('select');
$('class').onchange=()=>{if(selected>=0){remember(clone(boxes));boxes[selected].class=$('class').value;publish();render();}};
$('remove').onclick=()=>{if(selected>=0){remember(clone(boxes));boxes.splice(selected,1);selected=-1;publish();render();}};
$('clear').onclick=()=>{if(boxes.length){remember(clone(boxes));boxes=[];selected=-1;publish();render();}};
$('undo').onclick=()=>{if(undo.length){boxes=undo.pop();selected=-1;publish();render();}};
for(const key of['x1','y1','x2','y2'])$(key).onchange=()=>{if(selected<0)return;const next={...boxes[selected],xyxy:['x1','y1','x2','y2'].map(k=>Number($(k).value))};if(!valid(next)){$('message').textContent='坐标须在原图内，且x2>x1、y2>y1，宽高至少1像素。';return;}remember(clone(boxes));boxes[selected]=next;$('message').textContent='';publish();render();};
document.onkeydown=event=>{if(['INPUT','SELECT','TEXTAREA'].includes(event.target.tagName))return;if(event.key==='Delete')$('remove').click();if((event.ctrlKey||event.metaKey)&&event.key==='z'){event.preventDefault();$('undo').click();}};
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='streamlit:render')return;const args=event.data.args;const theme=event.data.theme||{};document.body.style.setProperty('--bg',theme.backgroundColor||'#fff');document.body.style.setProperty('--text',theme.textColor||'#222');if(args.document_key!==doc){doc=args.document_key;boxes=clone(args.boxes);selected=-1;undo=[];width=args.width;height=args.height;image=new Image();image.onload=fit;image.src=args.image;}$('message').textContent='';fit();});
new ResizeObserver(()=>fit()).observe(document.documentElement);
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
